<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF9">
  <script>
    /* Tema: se aplica antes de dibujar para que no parpadee */
    (function () {
      var t = 'auto'; try { t = localStorage.getItem('iptv_tema') || 'auto'; } catch (e) { }
      var osc = t === 'oscuro' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (osc) document.documentElement.classList.add('oscuro');
      var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', osc ? '#0F0E0D' : '#FAFAF9');
    })();
  </script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="IPTV">
  <title>App IPTV</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="app"></div>
  <nav id="nav" class="nav" hidden>

    <a href="#/clientes" data-tab="clientes"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8"/><path d="M22 21a7 7 0 0 0-4-6.3"/></svg>Clientes</a>
    <a href="#/cobro" data-tab="cobro"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Cobro</a>
    <a href="#/finanzas" data-tab="finanzas"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h3"/></svg>Finanzas</a>
  </nav>
  <div id="aviso-version" class="aviso-version" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="version.js"></script>
  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
